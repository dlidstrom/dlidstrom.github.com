<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multiplikationstabellen</title>
<style>
  :root {
    --cell-edge: #24517e;
    --paper: #f4efe4;
    --ink: #2b2b2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(#2c3a4d, #1d2634);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #app {
    background: var(--paper);
    border-radius: 18px;
    padding: 28px 32px 24px;
    width: min(420px, 94vw);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: .5px; }
  .subtitle { margin: 0 0 18px; color: #6a6154; font-size: 13px; }
  .progress { font-size: 13px; color: #6a6154; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .question {
    font-size: 44px;
    font-weight: 700;
    margin: 18px 0 20px;
    font-variant-numeric: tabular-nums;
  }
  input#answer {
    font: inherit;
    font-size: 28px;
    text-align: center;
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid #b8ae9c;
    background: #fff;
    color: var(--ink);
  }
  input#answer.wrong {
    animation: shake .3s ease;
    border-color: #b3452f;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .hint { margin-top: 10px; font-size: 13px; color: #b3452f; min-height: 1.4em; }
  .results h2 { margin: 0 0 12px; font-size: 20px; }
  .stat {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    margin: 6px 0;
  }
  .stat b { font-variant-numeric: tabular-nums; }
  button {
    font: inherit;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    padding: 11px 18px;
    background: var(--cell-edge);
    color: #fff;
    cursor: pointer;
    margin-top: 18px;
    width: 100%;
  }
  button:hover { background: #1d3f60; }
  button.secondary { background: #6a6154; }
  button.secondary:hover { background: #4f483e; }
  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; }
  .history { text-align: left; }
  .history h2 { text-align: center; margin: 0 0 12px; font-size: 20px; }
  .history .summary {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .history .summary .box {
    flex: 1;
    background: #fff;
    border: 1.5px solid #d8d0bd;
    border-radius: 10px;
    padding: 8px 6px;
  }
  .history .summary .box span {
    display: block;
    font-size: 11px;
    color: #6a6154;
    margin-bottom: 3px;
  }
  .history .summary .box b {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .history ul {
    list-style: none;
    margin: 0 0 6px;
    padding: 0 2px;
    max-height: 240px;
    overflow-y: auto;
  }
  .history li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 7px 0;
    border-top: 1px solid #e0d9c8;
    font-size: 14px;
    color: #6a6154;
  }
  .history li.best b { color: #2c7a4b; }
  .history li.empty { justify-content: center; color: #8a8170; font-style: italic; }
  .history li b { font-variant-numeric: tabular-nums; color: var(--ink); }
</style>
</head>
<body>
<div id="app">
  <h1>Multiplikationstabellen</h1>
  <p class="subtitle">Allt mellan 2 till 10 &times; 2 till 10</p>

  <div id="quiz">
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <input id="answer" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" />
    <div class="hint" id="hint"></div>
  </div>

  <div class="results" id="results" style="display:none">
    <h2>Klart!</h2>
    <div class="stat"><span>Frågor</span><b id="statCount"></b></div>
    <div class="stat"><span>Total tid</span><b id="statTotal"></b></div>
    <div class="stat"><span>Medeltid / fråga</span><b id="statAvg"></b></div>
    <div class="actions">
      <button id="restartBtn" type="button">Träna igen</button>
      <button id="showHistoryBtn" type="button" class="secondary">Historik</button>
    </div>
  </div>

  <div class="history" id="history" style="display:none">
    <h2>Historik</h2>
    <div class="summary">
      <div class="box"><span>Bästa medeltid</span><b id="historyBest"></b></div>
      <div class="box"><span>Träningar</span><b id="historyCount"></b></div>
      <div class="box"><span>Snitt, alla</span><b id="historyOverall"></b></div>
    </div>
    <ul id="historyList"></ul>
    <div class="actions">
      <button id="backBtn" type="button" class="secondary">Tillbaka</button>
    </div>
  </div>
</div>

<script>
"use strict";

const TOTAL_QUESTIONS = 10;
const MIN_FACTOR = 2;
const MAX_FACTOR = 10;

const quizEl = document.getElementById("quiz");
const progressEl = document.getElementById("progress");
const questionEl = document.getElementById("question");
const answerEl = document.getElementById("answer");
const hintEl = document.getElementById("hint");
const resultsEl = document.getElementById("results");
const historyEl = document.getElementById("history");
const historyListEl = document.getElementById("historyList");

const HISTORY_KEY = "mult-history";
let viewBeforeHistory = "quiz";

let index = 0;
let current = { a: 0, b: 0 };
let times = [];
let questionStart = 0;

function randomFactor() {
  return MIN_FACTOR + Math.floor(Math.random() * (MAX_FACTOR - MIN_FACTOR + 1));
}

function nextQuestion() {
  current.a = randomFactor();
  current.b = randomFactor();
  questionEl.textContent = `${current.a} × ${current.b}`;
  progressEl.textContent = `Fråga ${index + 1} av ${TOTAL_QUESTIONS}`;
  hintEl.textContent = "";
  answerEl.value = "";
  answerEl.classList.remove("wrong");
  answerEl.focus();
  questionStart = performance.now();
}

function formatSeconds(ms) {
  return (ms / 1000).toFixed(2) + " s";
}

function showResults() {
  quizEl.style.display = "none";
  resultsEl.style.display = "block";
  const total = times.reduce((sum, t) => sum + t, 0);
  document.getElementById("statCount").textContent = String(TOTAL_QUESTIONS);
  document.getElementById("statTotal").textContent = formatSeconds(total);
  document.getElementById("statAvg").textContent = formatSeconds(total / TOTAL_QUESTIONS);
  recordSession(total);
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(entries) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(entries));
  } catch (e) {}
}

function formatDate(ts) {
  return new Date(ts).toLocaleString("sv-SE", {
    year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
  });
}

function recordSession(total) {
  const entries = loadHistory();
  entries.push({ ts: Date.now(), total: total, avg: total / TOTAL_QUESTIONS, count: TOTAL_QUESTIONS });
  saveHistory(entries);
}

function renderHistory() {
  const entries = loadHistory();
  document.getElementById("historyCount").textContent = String(entries.length);
  if (entries.length === 0) {
    document.getElementById("historyBest").textContent = "\u2014";
    document.getElementById("historyOverall").textContent = "\u2014";
    historyListEl.innerHTML = "<li class=\"empty\">Inga resultat ännu — klara en träning först!</li>";
    return;
  }
  const best = Math.min(...entries.map(e => e.avg));
  const overall = entries.reduce((sum, e) => sum + e.avg, 0) / entries.length;
  document.getElementById("historyBest").textContent = formatSeconds(best);
  document.getElementById("historyOverall").textContent = formatSeconds(overall);
  const sorted = [...entries].reverse();
  historyListEl.innerHTML = sorted.map(e =>
    `<li${e.avg <= best ? " class=\"best\"" : ""}><span>${formatDate(e.ts)}</span>` +
    `<span><b>${formatSeconds(e.avg)}</b> / fråga</span></li>`
  ).join("");
}

function showHistory() {
  viewBeforeHistory = resultsEl.style.display === "block" ? "results" : "quiz";
  quizEl.style.display = "none";
  resultsEl.style.display = "none";
  historyEl.style.display = "block";
  renderHistory();
}

function hideHistory() {
  historyEl.style.display = "none";
  if (viewBeforeHistory === "results") {
    resultsEl.style.display = "block";
  } else {
    quizEl.style.display = "block";
    answerEl.focus();
  }
}

function start() {
  index = 0;
  times = [];
  resultsEl.style.display = "none";
  quizEl.style.display = "block";
  nextQuestion();
}

answerEl.addEventListener("input", () => {
  const value = answerEl.value.trim();
  if (value === "") return;
  const correct = current.a * current.b;
  const given = Number(value);
  if (given === correct) {
    times.push(performance.now() - questionStart);
    index++;
    if (index >= TOTAL_QUESTIONS) {
      showResults();
    } else {
      nextQuestion();
    }
    return;
  }
  if (value.length >= String(correct).length) {
    answerEl.value = "";
    answerEl.classList.remove("wrong");
    void answerEl.offsetWidth;
    answerEl.classList.add("wrong");
    hintEl.textContent = "Inte riktigt — försök igen.";
  }
});

document.getElementById("restartBtn").addEventListener("click", start);
document.getElementById("showHistoryBtn").addEventListener("click", showHistory);
document.getElementById("backBtn").addEventListener("click", hideHistory);

start();
</script>
</body>
</html>
